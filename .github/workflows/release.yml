# 版本沿革 / 资产指纹（出包收尾维护；注释不影响 workflow 行为）
# v9.7  2026-11-08  weread_K4.koplugin-v9.7.zip  2c78fa22b0859a426825ab84fb6b35e9d2f903be875aebb185d49668bc791ce9
# v9.8  2026-11-08  weread_K4.koplugin-v9.8.zip  e35e727d8dfb897e7afa888dde38d5ea3ad6c53893657299a9c4b1e1b39bfd89
# v9.9  2026-11-10  weread_K4.koplugin-v9.9.zip  bd7ac215f93eb5c55b11c79961e3013baa7b333d1a67614d200477ee5117ddc6
name: release

# Release assets are produced ONLY here (never by hand on a workstation).
# Pushing a v* tag builds weread_K4.koplugin-v<ver>.zip + .sha256 and
# publishes both as GitHub Release assets.
# build_release.sh refuses a dirty worktree or a HEAD that differs from the
# tag, so fetch-depth: 0 is required for the tag ref to be resolvable.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release package (zip + sha256)
        run: bash tools/build_release.sh

      - name: Verify checksum
        run: sha256sum -c weread_K4.koplugin-v*.zip.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            weread_K4.koplugin-v*.zip weread_K4.koplugin-v*.zip.sha256 \
            --verify-tag \
            --title "weread_K4 ${GITHUB_REF_NAME}" \
            --notes "weread_K4 ${GITHUB_REF_NAME} — assets built by the release workflow from the tagged commit."
