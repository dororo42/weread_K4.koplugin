# v9.8  2026-11-08  weread_K4.koplugin-v9.8.zip  e35e727d8dfb897e7afa888dde38d5ea3ad6c53893657299a9c4b1e1b39bfd89
# v9.9  2026-11-10  weread_K4.koplugin-v9.9.zip  bd7ac215f93eb5c55b11c79961e3013baa7b333d1a67614d200477ee5117ddc6
# v9.10 2026-11-10  weread_K4.koplugin-v9.10.zip 8c41ed7c942388b0881ca52fd6a4d6b132921c42d4790f925cc33a2beb74e648
# v9.11 2026-11-10  weread_K4.koplugin-v9.11.zip d526615c8469fb0b6f09369b9d53c52db814bb59a5f290bd1db314514766f87c
name: release

# Release assets are produced ONLY here (never by hand on a workstation).
# Pushing a v* tag builds weread_K4.koplugin-v<ver>.zip + .sha256 and
# publishes both as GitHub Release assets.
# build_release.sh refuses a dirty worktree or a HEAD that differs from the
# tag, so fetch-depth: 0 is required for the tag ref to be resolvable.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Build release package (zip + sha256)
        run: bash tools/build_release.sh

      - name: Verify checksum
        run: sha256sum -c weread_K4.koplugin-v*.zip.sha256

      # Release notes mirror the matching ChangeLog.md section, so every
      # release (historical and new) uses the same concise Added/Changed/
      # Fixed format. A missing section fails the release instead of
      # publishing an off-style placeholder.
      - name: Derive release notes from ChangeLog.md
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import re
          import sys
          from pathlib import Path

          ver = sys.argv[1]
          text = Path("ChangeLog.md").read_text(encoding="utf-8")
          head = re.search(r"^## \[" + re.escape(ver) + r"\] - (\d{4}-\d{2}(?:-\d{2})?)\s*$", text, re.M)
          if not head:
              raise SystemExit("no ChangeLog.md section for " + ver)
          following = re.search(r"^## \[", text[head.end():], re.M)
          end = head.end() + following.start() if following else len(text)
          body = text[head.end():end].strip()
          Path("release_notes.md").write_text(
              f"# weread_K4 {ver} · {head.group(1)}\n\n{body}\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            weread_K4.koplugin-v*.zip weread_K4.koplugin-v*.zip.sha256 \
            --verify-tag \
            --title "weread_K4 ${GITHUB_REF_NAME}" \
            --notes-file release_notes.md
