name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs of the same ref (e.g. after a force push) are cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          # Keep strict standard Lua 5.1 (not LuaJIT): it is a compatibility
          # sentinel — any spec using post-5.1 syntax (\x/\z escapes, goto,
          # integer division) fails here instead of on device.
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v5

      - name: Install busted + luacheck
        run: |
          luarocks install busted
          luarocks install luacheck

      - name: Syntax sentinel (strict Lua 5.1 luac -p)
        # Same compatibility sentinel as the runtime above: post-5.1 syntax
        # (\x/\z escapes, goto, integer division) must fail here, not on
        # device. luac ships with the same leafo/gh-actions-lua build.
        # git ls-files = exactly the tracked sources (no .luarocks, no
        # spec fixtures), one path per line; luac -p parses each file.
        run: |
          git ls-files -z '*.lua' | xargs -0 luac -p
          echo "luac -p OK for $(git ls-files '*.lua' | wc -l) files"

      - name: Unit tests (busted)
        run: busted spec

      - name: Lint (luacheck)
        run: |
          set -o pipefail
          luacheck --version
          echo "=== project config ==="
          luacheck weread spec tools main.lua _meta.lua | tee luacheck_output.txt || true
          echo "=== no config ==="
          luacheck --no-config weread spec tools main.lua _meta.lua | tee luacheck_noconfig.txt || true
          echo "=== spec only (project config) ==="
          luacheck spec | tee luacheck_spec.txt || true
          sed -r "s/\x1B\[[0-9;]*[A-Za-z]//g" luacheck_output.txt > luacheck_clean.txt
          if grep -qE "Total: 0 warnings / 0 errors" luacheck_clean.txt; then
            echo "LINT GREEN"
            exit 0
          fi
          # ONE packed annotation: only finding lines (path:line:col) from
          # the project-config run, newline-escaped
          FINDINGS=$(grep -E "\.lua:[0-9]+:[0-9]+:" luacheck_clean.txt | sed -r "s/\x1B\[[0-9;]*[A-Za-z]//g" | head -n 15 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
          echo "::error::FINDINGS: $FINDINGS"
          exit 1
