name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v5

      - name: Install busted + luacheck
        run: |
          luarocks install busted
          luarocks install luacheck

      - name: Syntax sentinel (strict Lua 5.1 luac -p)
        run: |
          git ls-files -z '*.lua' | xargs -0 luac -p
          echo "luac -p OK for $(git ls-files '*.lua' | wc -l) files"

      - name: Unit tests (busted)
        run: |
          set -o pipefail
          busted spec --verbose | tee busted_output.txt
        continue-on-error: true

      - name: Commit busted output for diagnosis
        run: |
          git config user.name "ci-diag"
          git config user.email "ci-diag@users.noreply.github.com"
          git add busted_output.txt || true
          git commit -m "ci-diag: busted output for ${GITHUB_SHA}" || echo "nothing to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:ci-diag-log || true

      - name: Lint (luacheck)
        run: luacheck weread spec tools main.lua _meta.lua
        continue-on-error: true

      - name: Report status
        run: |
          tail -n 40 busted_output.txt
          if grep -qE "0 failures / 0 errors" busted_output.txt; then
            echo "BUSTED GREEN"
          else
            echo "BUSTED RED"
            exit 1
          fi
